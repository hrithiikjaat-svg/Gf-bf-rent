<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | Companion Connect</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 20px;
}

.container {
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

h1 {
  text-align: center;
  color: #ff4f81;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0 15px;
  border: 1px solid #ddd;
  border-radius: 6px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 14px;
  background: #ff4f81;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

<h1>Register Your Profile</h1>

<p>18+ adults only. Register for social companionship.</p>

<form onsubmit="submitForm(event)">

<label>Full Name</label>
<input type="text" required>

<label>Age</label>
<input type="number" min="18" required>

<label>Gender</label>
<select required>
<option value="">Select</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>City</label>
<input type="text" required>

<label>About You</label>
<textarea rows="4" placeholder="Tell us about yourself"></textarea>

<label>Contact Email</label>
<input type="email" required>

<label>
<input type="checkbox" required>
I confirm that I am 18 or older.
</label>

<button type="submit">Submit Registration</button>

</form>

</div>

<script>
function submitForm(event) {
  event.preventDefault();

  alert("Registration received! Admin approval is required.");
}
</script>

</body>
</html>
